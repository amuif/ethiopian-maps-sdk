# Planetiler configuration for Ethiopian Maps SDK
# Profile: OpenMapTiles schema optimized for Ethiopia
download=true
fetch-wikidata=false

# Bounding box for Ethiopia (min_lon, min_lat, max_lon, max_lat)
bounds=32.99,3.40,47.98,14.89

# Zoom levels: z0 - z14 enables client-side overzooming to z18+
minzoom=0
maxzoom=14

# Memory management for CI runners (7GB RAM limit)
nodemap-type=sparsearray
nodemap-storage=mmap
multipolygon-geometry-storage=mmap

# Features configuration
building_merge_z13=true
transportation_z13_paths=true
