name: Build and Release Vector Tiles

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force clean rebuild of all tiles'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-tiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Freeing runner disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pmtiles CLI & jq
        run: |
          echo "Installing pmtiles CLI..."
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.20.0/go-pmtiles_1.20.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin pmtiles
          chmod +x /usr/local/bin/pmtiles
          pmtiles version

      - name: Fetch OpenStreetMap Extract
        run: bash pipeline/scripts/fetch-osm.sh data

      - name: Build nationwide ethiopia.pmtiles via Planetiler
        run: bash pipeline/scripts/generate-tiles.sh data dist

      - name: Slice metropolitan city extracts
        run: bash pipeline/scripts/slice-cities.sh dist/ethiopia.pmtiles dist/slices

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d')"
          echo "Creating or updating release: ${TAG_NAME}"

          # Create release if it doesn't exist
          gh release view "${TAG_NAME}" || gh release create "${TAG_NAME}" \
            --title "Ethiopia Vector Tiles (${TAG_NAME})" \
            --notes "Automated weekly build of OpenStreetMap vector tiles for Ethiopia."

          # Upload artifacts with clobber flag for idempotency
          gh release upload "${TAG_NAME}" \
            dist/ethiopia.pmtiles \
            dist/slices/*.pmtiles \
            --clobber
