name: Build and Release Buildings

# Extra footprints change slowly (Overture releases monthly), so this runs on demand.
on:
  workflow_dispatch:
    inputs:
      overture_release:
        description: 'Overture release, e.g. 2026-11-18.0 (blank = latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build tippecanoe
        run: |
          sudo apt-get update -q && sudo apt-get install -yq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.53.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" && sudo make -C /tmp/tippecanoe install
          tippecanoe --version

      - name: Build buildings.pmtiles
        env:
          OVERTURE_RELEASE: ${{ inputs.overture_release }}
        run: bash pipeline/scripts/build-buildings.sh data/buildings dist

      - name: Upload to the buildings release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="buildings-overture"
          gh release view "${TAG_NAME}" || gh release create "${TAG_NAME}" \
            --title "Ethiopia Extra Building Footprints (Overture)" \
            --notes "Microsoft, Google Open Buildings and Esri footprints that OpenStreetMap lacks, from the Overture Maps buildings theme (ODbL). Heights from Overture where known."
          gh release upload "${TAG_NAME}" dist/buildings.pmtiles --clobber
