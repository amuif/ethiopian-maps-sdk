name: Native SDKs

on:
  push:
    paths: ['android/**', 'ios/**', 'flutter/**', 'styles/*.json', 'tools/sync-native-styles.sh', '.github/workflows/native-sdks.yml']
  pull_request:
    paths: ['android/**', 'ios/**', 'flutter/**', 'styles/*.json', 'tools/sync-native-styles.sh']

jobs:
  styles-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/sync-native-styles.sh --check

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: ./gradlew --console=plain testDebugUnitTest assembleRelease

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: flutter } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get && flutter analyze && flutter test
